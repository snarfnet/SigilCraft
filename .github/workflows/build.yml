name: Build and Upload to App Store

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -n "$XCODE_APP" ]; then
          sudo xcode-select -s "/Applications/$XCODE_APP"
        else
          XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE_APP"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Set build number
      run: |
        BUILD_NUM=$(( ${{ github.run_number }} + 10 ))
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i "" "s/CURRENT_PROJECT_VERSION: [0-9]*/CURRENT_PROJECT_VERSION: $BUILD_NUM/" project.yml
        echo "Build number: $BUILD_NUM"

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

    - name: Build Archive
      run: |
        xcodebuild archive \
          -scheme SigilCraft \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath build/SigilCraft.xcarchive \
          CURRENT_PROJECT_VERSION=${BUILD_NUM} \
          CODE_SIGN_STYLE=Automatic \
          DEVELOPMENT_TEAM=83VGKGSQUH \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath build/SigilCraft.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist export_options.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Capture Screenshots
      run: |
        set -e
        IPHONE=$(xcrun simctl list devices available | grep -oE "iPhone 16 Pro Max" | head -1)
        [ -z "$IPHONE" ] && IPHONE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | tail -1)
        echo "iPhone: $IPHONE"
        xcodebuild build -scheme SigilCraft -configuration Release \
          -destination "platform=iOS Simulator,name=$IPHONE" \
          -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | tail -3
        APP=$(find build/sim/Build/Products -maxdepth 3 -name "*.app" | head -1)
        xcrun simctl boot "$IPHONE" || true
        xcrun simctl bootstatus "$IPHONE"
        xcrun simctl install "$IPHONE" "$APP"
        xcrun simctl launch "$IPHONE" com.tokyonasu.SigilCraft || true
        mkdir -p shots/iphone
        sleep 12
        xcrun simctl io "$IPHONE" screenshot shots/iphone/1.png
        IPAD=$(xcrun simctl list devices available | grep -oE "iPad Pro 13-inch \(M[0-9]+\)" | head -1)
        [ -z "$IPAD" ] && IPAD=$(xcrun simctl list devices available | grep -oE "iPad Pro [0-9]+-inch \(M[0-9]+\)" | head -1)
        [ -z "$IPAD" ] && IPAD=$(xcrun simctl list devices available | grep -oE "iPad Pro[^(]*\(M[0-9]+\)" | head -1)
        echo "iPad: $IPAD"
        xcodebuild build -scheme SigilCraft -configuration Release \
          -destination "platform=iOS Simulator,name=$IPAD" \
          -derivedDataPath build/simpad CODE_SIGNING_ALLOWED=NO | tail -3
        APPPAD=$(find build/simpad/Build/Products -maxdepth 3 -name "*.app" | head -1)
        xcrun simctl boot "$IPAD" || true
        xcrun simctl bootstatus "$IPAD"
        xcrun simctl install "$IPAD" "$APPPAD"
        xcrun simctl launch "$IPAD" com.tokyonasu.SigilCraft || true
        mkdir -p shots/ipad
        sleep 12
        xcrun simctl io "$IPAD" screenshot shots/ipad/1.png
        ls -la shots/iphone shots/ipad

    - name: Install PyJWT
      run: pip3 install --break-system-packages PyJWT requests

    - name: Upload Screenshots
      run: python3 scripts/upload_screenshots.py

    - name: Submit for Review
      run: python3 scripts/submit.py ${{ env.BUILD_NUM }}
